services:
  graphite:
    image: ${IMAGE_NAME:-graphiteapp/graphite-statsd}:${TAG:-latest}
    container_name: graphite
    environment:
      - TZ=UTC
    ports:
      - "80:80"
      - "2003:2003"
      - "2004:2004"
    volumes:
      - ${MNT_DIR}/data/graphite:/data
      - ${MNT_DIR}/config/graphite:/config
    networks:
      - vnet-frontend
      - vnet-backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  vnet-frontend:
    external: true
  vnet-backend:
    external: true
