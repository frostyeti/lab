services:
  arcane:
    # TODO: Replace with the actual image for Arcane (https://getarcane.app/)
    image: ${IMAGE_NAME:-nginx:alpine}
    container_name: arcane
    environment:
      - TZ=UTC
    ports:
      - "8080:8080"
    volumes:
      - ${MNT_DIR}/data/arcane:/data
      - ${MNT_DIR}/config/arcane:/config
    networks:
      - vnet-frontend
      - vnet-backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  vnet-frontend:
    external: true
  vnet-backend:
    external: true
