services:
  chrony:
    image: ${IMAGE_NAME:-cturra/ntp}:${TAG:-latest}
    container_name: chrony
    environment:
      - TZ=UTC
    ports:
      - "123:123/udp"
    volumes:
      - ${MNT_DIR}/data/chrony:/data
      - ${MNT_DIR}/config/chrony:/config
    healthcheck:
      test: ["CMD", "chronyc", "-n", "tracking"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - vnet-frontend
      - vnet-backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  vnet-frontend:
    external: true
  vnet-backend:
    external: true
