services:
  gatus:
    image: ${IMAGE_NAME:-twinproduction/gatus}:${TAG:-latest}
    container_name: gatus
    environment:
      - TZ=UTC
    ports:
      - "8080:8080"
    volumes:
      - ${MNT_DIR}/data/gatus:/data
      - ${MNT_DIR}/etc/gatus:/config
    networks:
      - vnet-frontend
      - vnet-backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  vnet-frontend:
    external: true
  vnet-backend:
    external: true
