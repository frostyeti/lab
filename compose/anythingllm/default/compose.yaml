services:
  anythingllm:
    image: ${IMAGE_NAME:-mintplexlabs/anythingllm}:${TAG:-latest}
    container_name: anythingllm
    restart: unless-stopped
    environment:
      - TZ=UTC
      - STORAGE_DIR=/app/server/storage
    ports:
      - "3001:3001"
    volumes:
      - ${MNT_DIR}/data/anythingllm:/app/server/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - vnet-frontend
      - vnet-backend

networks:
  vnet-frontend:
    external: true
  vnet-backend:
    external: true
