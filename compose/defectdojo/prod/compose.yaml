services:
  defectdojo:
    image: ${IMAGE_NAME:-defectdojo/defectdojo-django}:${TAG:-latest}
    container_name: defectdojo
    environment:
      - TZ=UTC
    ports:
      - "8080:8080"
    volumes:
      - ${MNT_DIR}/data/defectdojo:/data
      - ${MNT_DIR}/config/defectdojo:/config
    networks:
      - vnet-frontend
      - vnet-backend
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

networks:
  vnet-frontend:
    external: true
  vnet-backend:
    external: true
